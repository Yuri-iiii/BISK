<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISK</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-red: #ff0055;
            --neon-glow: rgba(255, 0, 85, 0.6);
            --bg-color: #0d0d11;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        /* Pure CSS Grid Pixel Heart */
        .pixel-heart {
            display: grid;
            grid-template-columns: repeat(7, 12px);
            grid-template-rows: repeat(6, 12px);
            gap: 0;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 10px var(--neon-red)) drop-shadow(0 0 20px var(--neon-red));
            animation: pulse 1.2s infinite alternate;
        }

        .px { background-color: transparent; }
        .px.r { background-color: var(--neon-red); }

        @keyframes pulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px var(--neon-red)) drop-shadow(0 0 15px var(--neon-glow));
            }
            100% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 15px var(--neon-red)) drop-shadow(0 0 35px var(--neon-red));
            }
        }

        h1 {
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .custom-message {
            font-size: 0.85rem;
            color: var(--neon-red);
            line-height: 1.8;
            margin-bottom: 2rem;
            text-shadow: 0 0 8px var(--neon-glow);
            max-width: 450px;
        }

        /* Social Links */
        .socials {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .social-btn {
            color: #fff;
            text-decoration: none;
            padding: 14px 20px;
            border: 3px solid var(--neon-red);
            background: rgba(255, 0, 85, 0.1);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .social-btn:hover {
            background: var(--neon-red);
            color: #000;
            box-shadow: 0 0 25px var(--neon-red);
        }

        /* Vinyl Disc Player (Bottom Left) */
        .music-disc-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            cursor: pointer;
            user-select: none;
        }

        .vinyl-disc {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #0d0d11 15%, var(--neon-red) 16%, #1a1a24 35%, #000 40%, #222 70%, #111 100%);
            border: 3px solid var(--neon-red);
            box-shadow: 0 0 12px var(--neon-glow);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl-disc::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #0d0d11;
            border: 2px solid var(--neon-red);
            border-radius: 50%;
        }

        .spinning {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .disc-label {
            font-size: 0.55rem;
            color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-glow);
        }

        /* Overlay */
        .audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(13, 13, 17, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
        }

        .audio-overlay p {
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--neon-red);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Click-to-Play Overlay -->
    <div id="overlay" class="audio-overlay">
        <div class="pixel-heart">
            <div class="px"></div><div class="px r"></div><div class="px r"></div><div class="px"></div><div class="px r"></div><div class="px r"></div><div class="px"></div>
            <div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div>
            <div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div>
            <div class="px"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px"></div>
            <div class="px"></div><div class="px"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px"></div><div class="px"></div>
            <div class="px"></div><div class="px"></div><div class="px"></div><div class="px r"></div><div class="px"></div><div class="px"></div><div class="px"></div>
        </div>
        <p>[ CLICK ANYWHERE TO START ]</p>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="pixel-heart">
            <div class="px"></div><div class="px r"></div><div class="px r"></div><div class="px"></div><div class="px r"></div><div class="px r"></div><div class="px"></div>
            <div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div>
            <div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div>
            <div class="px"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px"></div>
            <div class="px"></div><div class="px"></div><div class="px r"></div><div class="px r"></div><div class="px r"></div><div class="px"></div><div class="px"></div>
            <div class="px"></div><div class="px"></div><div class="px"></div><div class="px r"></div><div class="px"></div><div class="px"></div><div class="px"></div>
        </div>

        <h1>THANK YOU<br>FOR YOUR ORDER!</h1>

        <p id="random-message" class="custom-message"></p>
        
        <div class="socials">
            <a href="https://www.instagram.com/worththe_bisk/#" target="_blank" class="social-btn">INSTAGRAM</a>
            <a href="https://www.facebook.com/yuri.arguelles.1" target="_blank" class="social-btn">CONTACTS</a>
            <a href="https://www.facebook.com/profile.php?id=61593712204061" target="_blank" class="social-btn">FACEBOOK</a>
        </div>
    </div>

    <!-- Vinyl Disc Player -->
    <div class="music-disc-container" id="disc-toggle" title="Click to Play/Pause Music">
        <div class="vinyl-disc" id="vinyl-disc"></div>
        <span class="disc-label" id="disc-label">MUSIC OFF</span>
    </div>

    <!-- Audio Element -->
    <audio id="music-box" preload="auto"></audio>

    <script>
        const overlay = document.getElementById('overlay');
        const audio = document.getElementById('music-box');
        const messageElement = document.getElementById('random-message');
        const vinylDisc = document.getElementById('vinyl-disc');
        const discToggle = document.getElementById('disc-toggle');
        const discLabel = document.getElementById('disc-label');

        // Add your song paths here
        const playlist = [
            "Taylor Swift - Guilty as Sin_ (Lyrics).mp3",
            "Janine Berdin - What if I miss you for the rest of my life_ (Live in the Studio).mp3",
            "The 1975 - About You (Official).mp3",
            "Ben&Ben - Lifetime (Reimagined).mp3",
            
        ];

        let shuffledPlaylist = [];
        let currentIndex = 0;

        // Shuffles the playlist array on every page load
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize shuffled order when page loads
        shuffledPlaylist = shuffleArray(playlist);

        function playCurrentTrack() {
            audio.src = shuffledPlaylist[currentIndex];
            audio.play().then(() => {
                vinylDisc.classList.add('spinning');
                discLabel.textContent = "MUSIC ON";
            }).catch(err => console.log("Playback error: ", err));
        }

        function toggleAudio() {
            if (audio.paused) {
                if (!audio.src) {
                    playCurrentTrack();
                } else {
                    audio.play().then(() => {
                        vinylDisc.classList.add('spinning');
                        discLabel.textContent = "MUSIC ON";
                    });
                }
            } else {
                audio.pause();
                vinylDisc.classList.remove('spinning');
                discLabel.textContent = "MUSIC OFF";
            }
        }

        // When a song ends, automatically play the next track in the shuffled list
        audio.addEventListener('ended', () => {
            currentIndex = (currentIndex + 1) % shuffledPlaylist.length; // Loops back to start when list ends
            playCurrentTrack();
        });

        // Click overlay to start playback
        overlay.addEventListener('click', () => {
            playCurrentTrack();
            overlay.classList.add('hidden');
        });

        // Toggle pause/play on record click
        discToggle.addEventListener('click', toggleAudio);

        // Random custom text message
        const messages = [
            "Be careful who you trust. Salt and sugar look the same.",
            "There is nothing stronger than a broken woman who has rebuilt herself.",
            "The best is yet to come.",
            "You will meet someone who will change your life.",
            "Your hard work will soon pay off.",
            "Expect the unexpected.",
            "Love isn’t something you find. Love is something that finds you.",
            "You will find your solution when you least expect it.",
            "What you desire is always possible; it will come to you.",
            "Your investments of time now will lead to success later."
        ];

        function showRandomMessage() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            messageElement.textContent = messages[randomIndex];
        }

        showRandomMessage();
    </script>
</body>
</html>
